services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerloop
      POSTGRES_USER: ledgerloop
      POSTGRES_PASSWORD: ledgerloop
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerloop -d ledgerloop"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/LedgerLoop.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LedgerLoop: "Host=db;Port=5432;Database=ledgerloop;Username=ledgerloop;Password=ledgerloop"
      Database__AutoMigrate: "true"
      Database__Seed: "true"
      Cors__Origins__0: "http://localhost:8080"
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./src/LedgerLoop.Web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
