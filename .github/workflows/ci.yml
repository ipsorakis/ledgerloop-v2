name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerloop
          POSTGRES_USER: ledgerloop
          POSTGRES_PASSWORD: ledgerloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerloop -d ledgerloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LEDGERLOOP_TEST_CONNECTION: "Host=localhost;Port=5432;Database=ledgerloop;Username=ledgerloop;Password=ledgerloop"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/LedgerLoop.Web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/LedgerLoop.Web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
